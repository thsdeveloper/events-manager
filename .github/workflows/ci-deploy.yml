name: CI e deploy de desenvolvimento

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flouvi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SUPABASE_PROJECT_REF: yqjkujwugetsffldkisd

jobs:
  validate:
    name: Testes, tipos, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @events-manager/contracts build
      - run: pnpm -r --workspace-concurrency=1 test --maxWorkers=2
      - run: pnpm lint
      - run: pnpm build
        env:
          API_INTERNAL_URL: http://127.0.0.1:3333
          NEXT_PUBLIC_SITE_URL: https://flouvi-dev.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://yqjkujwugetsffldkisd.supabase.co
      - run: pnpm audit --prod --audit-level=high
      - name: Validar imagem da API
        run: docker build -f apps/api/Dockerfile -t flouvi-api:ci .

  database:
    name: Banco — migrations e testes SQL isolados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Desabilitar seed de demonstração no runner
        # db start também executa o seed; a suíte SQL cria as próprias fixtures.
        run: sed -i '/^\[db.seed\]/,/^\[/s/^enabled = true$/enabled = false/' supabase/config.toml
      - name: Iniciar Postgres descartável no runner
        run: pnpm exec supabase db start
      - name: Validar todas as migrations sem dados de demonstração
        run: pnpm exec supabase db reset --local --no-seed
      - name: Executar testes SQL no banco isolado
        run: pnpm exec supabase test db --local
      - name: Encerrar banco de testes
        if: always()
        run: pnpm exec supabase stop --no-backup

  migrate:
    name: Supabase — migrations
    needs: [validate, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vincular projeto Supabase de desenvolvimento
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Aplicar somente migrations (sem seed de demonstração)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase db push --linked --yes

  api:
    name: Fly.io — API
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://flouvi-api-dev.fly.dev/health
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.4.120
      - name: Atualizar a única máquina da API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --config fly.toml
      - name: Verificar API e conexão com banco
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            https://flouvi-api-dev.fly.dev/health | jq -e '.status == "ok"'

  web:
    name: Vercel — frontend
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://flouvi-dev.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The provider calls this slot production; the project itself is flouvi-dev.
      - run: pnpm dlx vercel@65.17.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: pnpm dlx vercel@65.17.0 build --prod --token "$VERCEL_TOKEN"
      - run: pnpm dlx vercel@65.17.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verificar frontend e proxy da API
        run: |
          curl --fail --silent --show-error --retry 3 https://flouvi-dev.vercel.app/ -o /dev/null
          curl --fail --silent --show-error --retry 3 https://flouvi-dev.vercel.app/api/event-categories | jq -e 'type == "array" or has("data")'
