project_id = "events-manager"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3003"
additional_redirect_urls = ["http://127.0.0.1:3003", "http://localhost:3003/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
# Piso do provedor, alinhado com `newPasswordSchema` em @events-manager/contracts.
# Sem isso vale o padrão do Supabase (6), que aceitaria senhas que a API recusa.
# A exigência de letras/números/símbolos fica só no schema: as opções de
# `password_requirements` do Supabase que incluem símbolos também obrigam
# maiúscula E minúscula, o que é mais estrito do que a política definida.
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "Seu código de confirmação"
content_path = "./supabase/templates/confirmation.html"

[analytics]
enabled = false
