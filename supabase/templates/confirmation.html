<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Confirme seu e-mail</title>
	</head>
	<body style="margin: 0; background: #f4f3ff; color: #172033; font-family: Arial, sans-serif">
		<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 32px 16px">
			<tr>
				<td align="center">
					<table
						role="presentation"
						width="100%"
						cellspacing="0"
						cellpadding="0"
						style="
							max-width: 560px;
							overflow: hidden;
							border: 1px solid #e5e7eb;
							border-radius: 20px;
							background: #ffffff;
						"
					>
						<tr>
							<td style="padding: 32px">
								<p style="margin: 0 0 12px; color: #6644ff; font-size: 14px; font-weight: 700">EVENTS MANAGER</p>
								<h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2">Confirme seu e-mail</h1>
								<p style="margin: 0 0 24px; color: #4b5563; font-size: 16px; line-height: 1.6">
									Use o código abaixo para concluir seu cadastro. Ele expira em 15 minutos.
								</p>
								<div
									style="
										margin: 0 0 24px;
										border-radius: 16px;
										background: #f4f3ff;
										padding: 22px;
										color: #4c2ee8;
										font-size: 36px;
										font-weight: 800;
										letter-spacing: 10px;
										text-align: center;
									"
								>
									{{ .Token }}
								</div>
								<p style="margin: 0 0 24px; color: #6b7280; font-size: 14px; line-height: 1.6">
									Se você fechou a tela de confirmação, volte ao site para informar seu e-mail e o código.
								</p>
								<a
									href="{{ .SiteURL }}/confirmar-email"
									style="
										display: inline-block;
										border-radius: 12px;
										background: #6644ff;
										padding: 13px 20px;
										color: #ffffff;
										font-size: 15px;
										font-weight: 700;
										text-decoration: none;
									"
								>
									Confirmar cadastro
								</a>
							</td>
						</tr>
						<tr>
							<td style="border-top: 1px solid #e5e7eb; padding: 20px 32px; color: #9ca3af; font-size: 12px">
								Se você não solicitou este cadastro, ignore esta mensagem.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
